{% extends "base.html" %}
{% block content %}
<div class="card small">
<h1>Daftar</h1>
<form method="post">
    <label for="username">Username</label>
    <input id="username" autocomplete="username" name="username" required>

    <label for="password">Password</label>
    <input id="password" autocomplete="new-password" name="password" type="password" minlength="8" required>

    <button>Daftar</button>
</form>
<p>Sudah punya akun? <a href="{{ url_for('main.login') }}">Masuk</a></p>
</div>
{% endblock %}
